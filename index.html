<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>모두의 화장실 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css?v=1792647341">
</head>
<body>
<!--APP-START-->
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1 class="title">모두의 화장실 <span>만들기</span></h1>
      <p class="org">전교조서울지부성소수자위원회</p>
    </div>
    <div class="visitors" id="visitors" aria-label="이용객"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="btn-undo" title="되돌리기 (Ctrl+Z)" disabled>↶ 되돌리기</button>
      <button type="button" class="btn ghost" id="btn-redo" title="다시하기 (Ctrl+Y)" disabled>↷ 다시하기</button>
      <button type="button" class="btn ghost" id="btn-reset">처음부터</button>
      <button type="button" class="btn" id="btn-test">▶ 테스트하기</button>
      <button type="button" class="btn primary" id="btn-challenge">🏁 도전하기</button>
    </div>
  </header>

  <nav class="palette" id="palette" aria-label="설치할 물건"></nav>

  <main class="board-wrap" id="board-wrap">
    <canvas id="board" aria-label="화장실 보드"></canvas>
    <div class="selbar" id="selbar" hidden>
      <span class="sel-name" id="sel-name"></span>
      <button type="button" class="btn small" id="btn-rotate">⟳ 돌리기</button>
      <button type="button" class="btn small" id="btn-band" hidden>⇕ 높이</button>
      <button type="button" class="btn small" id="btn-delete">지우기</button>
      <button type="button" class="btn small primary" id="btn-deselect">완료</button>
    </div>
    <div class="zoom">
      <button type="button" class="zbtn" id="btn-pan" aria-pressed="false" title="화면 옮기기">✋</button>
      <button type="button" class="zbtn" id="btn-zoom-in" title="확대">＋</button>
      <button type="button" class="zbtn" id="btn-zoom-out" title="축소">－</button>
      <button type="button" class="zbtn" id="btn-fit" title="보드를 화면에 맞추기">⊡</button>
      <button type="button" class="zbtn" id="btn-full" title="전체 화면">⛶</button>
    </div>
    <div class="band-bar" id="band-bar" role="group" aria-label="붙일 높이" hidden></div>
    <div class="rotate-hint" id="rotate-hint" hidden>
      화면을 가로로 돌리면 더 크게 보여요
      <button type="button" class="link" id="btn-hide-hint">닫기</button>
    </div>
  </main>

  <footer class="info" id="info" aria-live="polite"></footer>

  <div class="confirm" id="confirm" hidden>
    <div class="sheet">
      <p id="confirm-text"></p>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="confirm-no">취소</button>
        <button type="button" class="btn primary" id="confirm-yes">확인</button>
      </div>
    </div>
  </div>

  <div class="result" id="result" hidden>
    <div class="sheet">
      <h2 id="result-title"></h2>
      <ul id="result-list"></ul>
      <div class="sheet-actions">
        <button type="button" class="btn primary" id="result-close">계속 꾸미기</button>
      </div>
    </div>
  </div>
</div>
<!--APP-END-->
<script src="js/config.js?v=1792647341"></script>
<script src="js/logic.js?v=1792647341"></script>
<script src="js/game.js?v=1792647341"></script>
</body>
</html>
